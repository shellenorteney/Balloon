<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Balloon</title>
  <style>
    #balloon {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: red;
    }
  </style>
  
</head>
<body>
  <div id="balloon"></div>

  <script>
    const balloon = document.getElementById('balloon');
    const colors = ['red', 'green', 'blue'];
    let size = 200;
    let color = 0;

    function update() {
      balloon.style.width = size + 'px';
      balloon.style.height = size + 'px';
      balloon.style.background = colors[color];
    }

    balloon.onclick = function () {
      size += 10;
      color = (color + 1) % 3;

      if (size > 420) {
        size = 200;
        color = 0;
      }

      update();
    };

    balloon.onmouseleave = function () {
      size = Math.max(200, size - 5);
      color = (color + 2) % 3;
      update();
    };
  </script>
</body>
</html>
